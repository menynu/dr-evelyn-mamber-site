name = "mamber-analytics"
main = "src/index.ts"
compatibility_date = "2025-11-01"

# Do not enable Workers Logs or Logpush (avoids Cloudflare storing IP/UA from requests).
logpush = false

[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "mmb-analytics"
# Replace after: wrangler d1 create mmb-analytics --jurisdiction eu
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["0 3 * * *"]

[vars]
ALLOWED_ORIGINS = "https://menynu.github.io"
MAX_EVENTS_PER_DAY = "60"
WRITE_SPIKE_LIMIT = "400"
RETENTION_DAYS = "90"

# Secrets: V_PEPPER, IP_SALT_SECRET, DASH_USER, DASH_PASS, WEEKLY_TOKEN
