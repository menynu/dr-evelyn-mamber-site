name = "mamber-analytics"
main = "src/index.ts"
compatibility_date = "2025-11-01"

[[d1_databases]]
binding = "DB"
database_name = "mamber-analytics"
# Replace after: wrangler d1 create mamber-analytics
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["0 3 * * *"]

[vars]
# Comma-separated origins, e.g. https://menynu.github.io,http://127.0.0.1:4392
ALLOWED_ORIGINS = "https://menynu.github.io"
# Daily event cap per visitor id (hashed)
MAX_EVENTS_PER_DAY = "60"
# Circuit breaker: max writes in a rolling minute before rejecting
WRITE_SPIKE_LIMIT = "400"

# Secrets (set with wrangler secret put):
# V_PEPPER, IP_SALT_SECRET, DASH_USER, DASH_PASS, WEEKLY_TOKEN
